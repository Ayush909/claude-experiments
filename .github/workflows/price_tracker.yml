name: Price Tracker

on:
  schedule:
    - cron: "30 3 * * *"  # 9:00 AM IST (UTC+5:30)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install playwright beautifulsoup4 && playwright install --with-deps chromium

      - name: Run price tracker
        run: python price_tracer.py

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "chore: update price history [$(date +'%Y-%m-%d')]"
          git push
